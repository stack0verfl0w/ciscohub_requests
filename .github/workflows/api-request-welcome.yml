name: API request welcome

on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Welcome triage note
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map((l) => l.name);
            if (!labels.includes('api-request')) {
              return;
            }
            const body = [
              'Thanks for the API coverage request.',
              '',
              '**Triage:** Maintainers will review and may add the `accepted` label when the request is ready for implementation.',
              '',
              '**Spam / abuse:** Off-topic or automated issues may be closed without notice. Use **Report content** on the issue if needed.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
